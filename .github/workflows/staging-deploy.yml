name: Staging CI/CD Pipeline

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run E2E tests"
        required: true
        default: true
        type: boolean

env:
  NODE_VERSION: "20"

jobs:
  quality_and_tests:
    name: Quality and Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      AI_PROVIDER: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Install Playwright browsers
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e == true }}
        run: pnpm test:e2e:install

      - name: Run E2E tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e == true }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 14

  build_unified:
    name: Build Unified Artifacts
    runs-on: ubuntu-latest
    needs: quality_and_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unified
        run: pnpm build:unified

  deploy_staging:
    name: Deploy Staging (Docker Profile)
    runs-on: [self-hosted, linux]
    needs: build_unified
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Docker staging profile
        run: pnpm deploy:docker:up:staging

      - name: Smoke test staging
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            BASE_URL="http://127.0.0.1:3101" pnpm deploy:smoke
          else
            pnpm deploy:smoke
          fi