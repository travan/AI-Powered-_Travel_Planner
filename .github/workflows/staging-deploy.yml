name: Staging CI/CD Pipeline

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run E2E tests"
        required: true
        default: true
        type: boolean

env:
  NODE_VERSION: "22"

jobs:
  quality_and_tests:
    name: Quality and Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      AI_PROVIDER: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests with coverage
        run: pnpm test:coverage

  e2e_tests:
    name: E2E Tests (${{ matrix.target }})
    # Playwright 1.59 does not support the Ubuntu 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [web, mobile]
    env:
      NODE_ENV: development
      AI_PROVIDER: mock
      E2E_TARGET: ${{ matrix.target }}
      EXPO_ROUTER_APP_ROOT: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e == true }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright ${{ matrix.target }} tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e == true }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging-${{ matrix.target }}
          path: playwright-report/
          retention-days: 14

  build_unified:
    name: Build Unified Artifacts
    runs-on: ubuntu-latest
    needs:
      - quality_and_tests
      - e2e_tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unified
        run: pnpm build:unified

  deploy_staging:
    name: Deploy Staging (Docker Profile)
    runs-on: [self-hosted, linux]
    needs: build_unified
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Docker staging profile
        run: pnpm deploy:docker:up:staging

      - name: Smoke test staging
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            BASE_URL="http://127.0.0.1:3101" pnpm deploy:smoke
          else
            pnpm deploy:smoke
          fi
