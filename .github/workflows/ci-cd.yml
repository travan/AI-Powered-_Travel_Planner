name: CI/CD Pipeline

concurrency:
  group: ci-cd-${{ github.ref }}
  # Do not interrupt a production migration/deployment when main advances.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "packages/**"
      - "e2e/**"
      - "tests/**"
      - "deploy/**"
      - "scripts/**"
      - "library-guidelines/**"
      - ".github/workflows/**"
      - "vitest.config.ts"
      - "vitest.config.mts"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "packages/**"
      - "e2e/**"
      - "tests/**"
      - "deploy/**"
      - "scripts/**"
      - "library-guidelines/**"
      - ".github/workflows/**"
      - "vitest.config.ts"
      - "vitest.config.mts"
      - "playwright.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

jobs:
  security-gate:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  build:
    name: Build packages and apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store/v3
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unified server and web
        run: pnpm build:unified

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/server/dist
            apps/web/.next
          retention-days: 1

  database-parity:
    name: Database schema and catalog parity
    # Match E2E runners: the pinned Playwright version does not support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_parity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-travel-database-parity.mjs
        env:
          PARITY_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/travel_parity_test
      - name: Initialize isolated API test database
        run: node apps/server/scripts/init-local-postgres.mjs
        env:
          DATABASE_PROVIDER: postgres
          POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          POSTGRES_URL: postgresql://travel_e2e:test-only@127.0.0.1:5432/travel_api_test
      - name: Install Chromium for browser session security checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Test generation admission, single dispatch and checkpoint recovery
        run: ./apps/server/node_modules/.bin/tsx --tsconfig apps/server/tsconfig.json scripts/check-generation-v2.mts
        env:
          PLANNING_V2_TEST_URL: postgresql://travel_e2e:test-only@127.0.0.1:5432/travel_api_test
      - name: Test catalog-first pipeline with 100 local mock generations
        run: ./apps/server/node_modules/.bin/tsx --tsconfig apps/server/tsconfig.json scripts/check-generation-v2-pipeline.mts
        env:
          PLANNING_V2_TEST_URL: postgresql://travel_e2e:test-only@127.0.0.1:5432/travel_api_test
      - name: Test API persistence, private memory and approved spending
        run: pnpm exec playwright test --config playwright.server.config.ts
        env:
          E2E_POSTGRES_URL: postgresql://travel_e2e:test-only@127.0.0.1:5432/travel_api_test
          DOCUMENT_STORE: postgres

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    env:
      NODE_ENV: development
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      AI_PROVIDER: mock
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store/v3
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Run type check
        run: pnpm run type-check

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage reports
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          file: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests (${{ matrix.target }})
    # Playwright 1.59 does not support the Ubuntu 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [web, mobile]
    env:
      NODE_ENV: development
      E2E_TARGET: ${{ matrix.target }}
      EXPO_ROUTER_APP_ROOT: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store/v3
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright ${{ matrix.target }} tests
        run: pnpm exec playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.target }}
          path: playwright-report/
          retention-days: 30

  deploy-cloudflare:
    name: Deploy Cloudflare API
    runs-on: ubuntu-24.04
    needs: [unit-tests, e2e-tests, database-parity, security-gate]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 240
    environment:
      name: production
      url: https://travel-planner-api.travan-it-96.workers.dev
    env:
      API_BASE_URL: https://travel-planner-api.travan-it-96.workers.dev
      PLANNING_CANARY_EMAIL: ${{ secrets.PLANNING_CANARY_EMAIL }}
      PLANNING_CANARY_PASSWORD: ${{ secrets.PLANNING_CANARY_PASSWORD }}
      DEPLOY_AI_PROVIDER: ${{ vars.AI_PROVIDER || 'cloudflare' }}
      CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      PLANNING_CANARY_RUN_ID: ci-${{ github.run_id }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    permissions:
      contents: read
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_DATABASE_URL: ${{ secrets.CLOUDFLARE_MIGRATION_DATABASE_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set production secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$SUPABASE_DATABASE_URL" || { echo '::error::Set production secret CLOUDFLARE_MIGRATION_DATABASE_URL'; exit 1; }

      - run: pnpm install --frozen-lockfile

      - name: Prepare dedicated production canary account
        run: node scripts/prepare-production-canary.mjs

      - name: Select bounded production canary configuration
        env:
          JOURNEY_QUEUE_CONCURRENCY: "1"
          PLANNING_V2_PERCENT: "0"
          PLANNING_AI_CONCURRENCY: "1"
        run: |
          node apps/server/cloudflare/prepare-queue-config.mjs production
          echo 'WRANGLER_CONFIG=apps/server/wrangler.generated.json' >> "$GITHUB_ENV"

      - name: Initialize isolated candidate test database
        run: node apps/server/scripts/init-local-postgres.mjs
        env:
          DATABASE_PROVIDER: postgres
          POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          POSTGRES_URL: postgresql://travel_e2e:test-only@127.0.0.1:5432/travel_api_test

      - name: Test candidate with real default model before production deployment
        env:
          PLANNING_V2_TEST_URL: postgresql://travel_e2e:test-only@127.0.0.1:5432/travel_api_test
          PLANNING_LIVE_MODEL: "true"
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'cloudflare' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: 6b34ff1e99d15ffdbbb503dac4423549
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_APP_URL: https://ai-powered-travel-planner-api.vercel.app
        run: |
          for case_id in original-my-sg wide-my-sg short-da-nang; do
            PLANNING_LIVE_CASE="$case_id" ./apps/server/node_modules/.bin/tsx --tsconfig apps/server/tsconfig.json scripts/check-generation-v2-live.mts
          done

      - name: Sync configured third-party API secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/sync-planning-secrets.mjs

      - name: Provision production Queue and DLQ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/provision-planning-queues.mjs

      # Bundle before touching the database; Wrangler also validates the bindings.
      - name: Validate Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # dlx avoids wrangler-action attempting `pnpm add` at the workspace root.
        run: pnpm dlx wrangler@4.155.0 deploy --dry-run --config "$WRANGLER_CONFIG"

      - name: Validate and apply pending database migrations
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.CLOUDFLARE_MIGRATION_DATABASE_URL }}
        run: |
          node scripts/init-cloudflare-postgres.mjs --ci
          node scripts/init-cloudflare-postgres.mjs --ci --apply

      - name: Deploy Worker and scheduled jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm dlx wrangler@4.155.0 deploy --config "$WRANGLER_CONFIG" --var DEPLOY_COMMIT:${{ github.sha }}

      - name: Verify deployed revision and planner API
        env:
          API_BASE_URL: https://travel-planner-api.travan-it-96.workers.dev
          EXPECTED_DEPLOY_COMMIT: ${{ github.sha }}
          EXPECTED_PLANNING_V2_PERCENT: "0"
          EXPECTED_PLANNING_CANARY: "true"
        run: node scripts/smoke-cloudflare.mjs
      - name: Verify deployed producer, consumer and dead-letter queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-planning-bindings.mjs

      - name: Compare V1 and V2 generation on production (six sequential jobs)
        env:
          EXPECTED_DEPLOY_COMMIT: ${{ github.sha }}
        run: node scripts/check-production-generation.mjs

      - name: Promote V2 to all new requests after the canary passes
        id: promote-v2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JOURNEY_QUEUE_CONCURRENCY: "1"
          PLANNING_AI_CONCURRENCY: "1"
          PLANNING_V2_PERCENT: "100"
        run: |
          node apps/server/cloudflare/prepare-queue-config.mjs production
          pnpm dlx wrangler@4.155.0 deploy --config "$WRANGLER_CONFIG" --var DEPLOY_COMMIT:${{ github.sha }}
          node scripts/check-planning-bindings.mjs

      - name: Verify promoted revision and ordinary V2 generation
        env:
          EXPECTED_DEPLOY_COMMIT: ${{ github.sha }}
          EXPECTED_PLANNING_V2_PERCENT: "100"
          PLANNING_CANARY_MODE: promoted
        run: |
          node scripts/smoke-cloudflare.mjs
          node scripts/check-production-generation.mjs

      - name: Stop general V2 admission if promotion verification fails
        if: failure() && (steps.promote-v2.outcome == 'success' || steps.promote-v2.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JOURNEY_QUEUE_CONCURRENCY: "1"
          PLANNING_AI_CONCURRENCY: "1"
          PLANNING_V2_PERCENT: "0"
        run: |
          node apps/server/cloudflare/prepare-queue-config.mjs production
          pnpm dlx wrangler@4.155.0 deploy --config "$WRANGLER_CONFIG" --var DEPLOY_COMMIT:${{ github.sha }}
          node scripts/check-planning-bindings.mjs

      - name: Preserve production and candidate evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-production-${{ github.sha }}-${{ github.run_id }}
          path: |
            test-results/production-generation/
            test-results/generation-v2-live/
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, database-parity, security-gate]
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_LEGACY_VERCEL_DEPLOY == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store/v3
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Build for production
        run: pnpm --dir apps/web build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/web
