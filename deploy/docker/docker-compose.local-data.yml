services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-travel-planner-postgres
    environment:
      POSTGRES_DB: travel_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai_travel_planner_postgres:/var/lib/postgresql/data
      - ../../apps/api/db/local-postgres.sql:/docker-entrypoint-initdb.d/001-local-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_planner"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: ai-travel-planner-mongodb
    ports:
      - "27017:27017"
    volumes:
      - ai_travel_planner_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ai_travel_planner_postgres:
  ai_travel_planner_mongodb:
