name: ai-travel-planner

x-app-image: &app-image
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile.unified
    args:
      API_PROXY_TARGET: http://server:3001
      NEXT_PUBLIC_API_URL: ""
  image: ai-travel-planner:server-web

x-server-env: &server-env
  NODE_ENV: ${API_NODE_ENV:-development}
  PORT: 3001
  SERVE_WEB: "false"
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  CORS_ORIGINS: http://localhost:3000,http://localhost:8081
  DATABASE_PROVIDER: postgres
  POSTGRES_URL: postgres://${POSTGRES_APP_USER:-travel_planner}:${POSTGRES_APP_PASSWORD:-travel_planner}@postgres:5432/${POSTGRES_DB:-travel_planner}
  DATABASE_URL: postgres://${POSTGRES_APP_USER:-travel_planner}:${POSTGRES_APP_PASSWORD:-travel_planner}@postgres:5432/${POSTGRES_DB:-travel_planner}
  MONGODB_URI: mongodb://mongo:27017/travel_planner
  MONGODB_DB_NAME: travel_planner
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env or shell}
  TEST_ENABLE_MOCK_TOKENS: "false"

services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-planner-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-travel_planner}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-travel_planner}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-travel_planner}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/000-create-app-role.sh:/docker-entrypoint-initdb.d/000-create-app-role.sh:ro
      - ../../apps/server/src/database/migrations/001_local_postgres.sql:/docker-entrypoint-initdb.d/001_local_postgres.sql:ro
      - ../../apps/server/src/database/migrations/003_collaboration_finance.sql:/docker-entrypoint-initdb.d/003_collaboration_finance.sql:ro
      - ../../apps/server/src/database/migrations/004_schedule_transport.sql:/docker-entrypoint-initdb.d/004_schedule_transport.sql:ro
      - ../../apps/server/src/database/migrations/005_review_ocr_recommendations.sql:/docker-entrypoint-initdb.d/005_review_ocr_recommendations.sql:ro
      - ../../apps/server/src/database/migrations/006_local_workspace_core_compat.sql:/docker-entrypoint-initdb.d/006_local_workspace_core_compat.sql:ro
      - ../../apps/server/src/database/migrations/007_repair_self_accepted_invites.sql:/docker-entrypoint-initdb.d/007_repair_self_accepted_invites.sql:ro
      - ../../apps/server/src/database/migrations/008_trip_schedule_compatibility.sql:/docker-entrypoint-initdb.d/008_trip_schedule_compatibility.sql:ro
      - ../../apps/server/src/database/migrations/009_server_workspace_compatibility.sql:/docker-entrypoint-initdb.d/009_server_workspace_compatibility.sql:ro
      - ../../apps/server/src/database/migrations/010_manual_city_catalog.sql:/docker-entrypoint-initdb.d/010_manual_city_catalog.sql:ro
      - ../../apps/server/src/database/migrations/011_ai_city_catalog_worker.sql:/docker-entrypoint-initdb.d/011_ai_city_catalog_worker.sql:ro
      - ./postgres/999-grant-app-role.sh:/docker-entrypoint-initdb.d/999-grant-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: travel-planner-mongo
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    <<: *app-image
    container_name: travel-planner-server
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      <<: *server-env
    ports:
      - "3001:3001"
    command: ["node", "apps/server/dist/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    <<: *app-image
    container_name: travel-planner-web
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PROXY_TARGET: http://server:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: ""
      AUTH_PROVIDER: local
      NEXT_PUBLIC_AUTH_PROVIDER: local
      ENABLE_MOCK_AUTH_SERVER: "false"
    ports:
      - "3000:3000"
    command: ["node", "apps/web/node_modules/next/dist/bin/next", "start", "apps/web", "--hostname", "0.0.0.0", "--port", "3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
