<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-background": "#191c1d",
                    "background": "#f8f9fa",
                    "surface-bright": "#f8f9fa",
                    "error": "#ba1a1a",
                    "outline": "#707881",
                    "surface-container-high": "#e7e8e9",
                    "primary-fixed-dim": "#94ccff",
                    "outline-variant": "#bfc7d1",
                    "on-tertiary-fixed": "#001f27",
                    "on-tertiary-container": "#ecf9ff",
                    "surface-tint": "#006399",
                    "on-surface-variant": "#404850",
                    "on-error-container": "#93000a",
                    "secondary-container": "#fc8a40",
                    "on-primary": "#ffffff",
                    "secondary-fixed-dim": "#ffb68d",
                    "inverse-surface": "#2e3132",
                    "surface-variant": "#e1e3e4",
                    "on-tertiary-fixed-variant": "#004e5f",
                    "secondary": "#9b4500",
                    "on-tertiary": "#ffffff",
                    "primary": "#005d90",
                    "inverse-on-surface": "#f0f1f2",
                    "on-error": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "surface-dim": "#d9dadb",
                    "on-secondary-fixed-variant": "#763300",
                    "surface-container-highest": "#e1e3e4",
                    "tertiary": "#006176",
                    "on-secondary-fixed": "#331200",
                    "on-primary-container": "#f3f7ff",
                    "on-secondary-container": "#672c00",
                    "tertiary-container": "#007c95",
                    "inverse-primary": "#94ccff",
                    "surface": "#f8f9fa",
                    "on-primary-fixed-variant": "#004b74",
                    "on-primary-fixed": "#001d32",
                    "on-secondary": "#ffffff",
                    "secondary-fixed": "#ffdbc9",
                    "surface-container-low": "#f3f4f5",
                    "primary-fixed": "#cde5ff",
                    "tertiary-fixed-dim": "#4cd6fb",
                    "surface-container": "#edeeef",
                    "on-surface": "#191c1d",
                    "error-container": "#ffdad6",
                    "primary-container": "#0077b6",
                    "tertiary-fixed": "#b3ebff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-editorial-gradient {
            background: linear-gradient(135deg, #005d90 0%, #0077b6 100%);
        }
        .glass-panel {
            background: rgba(248, 249, 250, 0.8);
            backdrop-filter: blur(24px);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center p-4 md:p-8 overflow-x-hidden">
<!-- Hero Background Layer -->
<div class="fixed inset-0 z-0">
<img alt="" class="w-full h-full object-cover" data-alt="Majestic high-altitude mountain range with sharp peaks, ethereal clouds, and soft blue atmospheric haze during early morning light." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC4Ee-UNmSEyJlqtU1X9g2-DEq42RJzV7xiW49ubKEkpL2BvsT2-e_1WsopzjwkLasJ_Ep_DhcSf7m2Vb9fKpZMqDd2VNUhkvYuvVJrVOQIc7mDBQqwBaOU5kOdAI8h4ruCYaWLZAB-5pPi2F23IUE98rFfNe_S3X57w3RNqe0Wx4xz0c7-ZwwA8bge4IFVjX6MKjgJUpGm_gwrWARDUaKUP0lX4CMJYOt5KsrQDGG_JA_Z8b7leqoC98FDY4jvVVVy8qolAXELKy4"/>
<div class="absolute inset-0 bg-gradient-to-tr from-on-background/40 to-transparent"></div>
</div>
<!-- Main Authentication Container -->
<main class="relative z-10 w-full max-w-[1100px] flex flex-col md:flex-row glass-panel rounded-xl overflow-hidden shadow-[0_32px_64px_-12px_rgba(0,93,144,0.04)]">
<!-- Left Side: Editorial Content -->
<div class="hidden md:flex md:w-1/2 p-12 flex-col justify-between relative overflow-hidden text-on-primary">
<div class="absolute inset-0 z-0">
<img alt="" class="w-full h-full object-cover opacity-90" data-alt="Serene alpine lake reflecting towering snow-capped mountains with a subtle turquoise water tone and soft cinematic lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGFxL5qPqnwMG5_SxfrtZc7MGjR6aUJgfoLDzIfkjh-QEsQ1ozB6Rw9cgGE3BXDvv1gQ0ia9Z6jDrm0gbmNCqAVefFsSUjUpe5u1VoJKkSLKYhmr5AaRWexP93BRNXQTXkDc-k0MTbsgoTwwySlKLLDos3GHWYhnOyBw9g27sp3yBc70jPq58S7ZlomUPhUD35TrSM8SZwlsExvBFengYf-lg0ojFBlEcMqqSnBY9JNAcUyyhAXA9tYEcYV-0IROCZcEGw5O6H-1Y"/>
<div class="absolute inset-0 bg-editorial-gradient opacity-60 mix-blend-multiply"></div>
</div>
<div class="relative z-10">
<div class="font-headline font-extrabold text-3xl tracking-tighter mb-8">Horizon</div>
<h1 class="font-headline text-5xl font-bold leading-[1.1] mb-6">Experience the art of the journey.</h1>
<p class="text-lg text-primary-fixed opacity-90 max-w-sm font-medium">Curated travel narratives for the modern explorer. Your digital concierge awaits.</p>
</div>
<div class="relative z-10 flex gap-4">
<div class="flex flex-col">
<span class="text-2xl font-bold font-headline">24k+</span>
<span class="text-xs uppercase tracking-widest opacity-70">Destinations</span>
</div>
<div class="w-px h-10 bg-primary-fixed-dim/30 mx-2"></div>
<div class="flex flex-col">
<span class="text-2xl font-bold font-headline">150+</span>
<span class="text-xs uppercase tracking-widest opacity-70">Curators</span>
</div>
</div>
</div>
<!-- Right Side: Auth Form -->
<div class="w-full md:w-1/2 p-8 md:p-16 bg-surface-container-lowest">
<div class="flex flex-col h-full max-w-md mx-auto">
<!-- Branding Mobile Only -->
<div class="md:hidden flex items-center gap-2 mb-10">
<span class="font-headline font-extrabold text-2xl tracking-tighter text-primary">Horizon</span>
</div>
<!-- Toggle Switch -->
<div class="flex bg-surface-container-low p-1.5 rounded-full mb-10 w-fit">
<button class="px-8 py-2 rounded-full text-sm font-semibold transition-all bg-surface-container-lowest text-on-surface shadow-sm">Login</button>
<button class="px-8 py-2 rounded-full text-sm font-semibold transition-all text-on-surface-variant hover:text-on-surface">Sign-up</button>
</div>
<div class="mb-8">
<h2 class="font-headline text-3xl font-bold text-on-surface mb-2">Start Your Narrative</h2>
<p class="text-on-surface-variant">Continue your narrative across the globe.</p>
</div>
<!-- Social Auth -->
<button class="w-full bg-editorial-gradient text-on-primary py-4 rounded-full font-bold flex items-center justify-center gap-3 transition-transform active:scale-[0.98] mb-6 shadow-md shadow-primary/20">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z"></path>
</svg>
                    Continue with Google
                </button>
<div class="relative flex items-center mb-8">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 text-xs font-bold uppercase tracking-widest text-outline">or email</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Form Fields -->
<form class="space-y-5">
<div class="space-y-1.5">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider ml-1" for="fullname">Full Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-high border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-fixed focus:bg-primary-fixed/20 transition-all" id="fullname" placeholder="Alex Horizon" type="text"/>
</div>
</div><div class="space-y-1.5">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider ml-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-high border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-fixed focus:bg-primary-fixed/20 transition-all" id="email" placeholder="explorer@horizon.com" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-high border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-fixed focus:bg-primary-fixed/20 transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<button class="w-full py-4 bg-on-surface text-surface rounded-full font-bold transition-all hover:bg-on-surface/90 active:scale-[0.98] mt-4" type="submit">Create Account</button>
</form>
<!-- Support Footer -->
<footer class="mt-auto pt-10 flex justify-center gap-6">
<a class="text-xs font-medium text-on-surface-variant opacity-70 hover:opacity-100 transition-all" href="#">Terms</a>
<a class="text-xs font-medium text-on-surface-variant opacity-70 hover:opacity-100 transition-all" href="#">Privacy</a>
<a class="text-xs font-medium text-on-surface-variant opacity-70 hover:opacity-100 transition-all" href="#">Support</a>
</footer>
</div>
</div>
</main>
<!-- Branding Shadow for Depth -->
<div class="fixed bottom-12 left-12 hidden lg:block pointer-events-none">
<div class="font-headline font-black text-[120px] leading-none text-on-surface/[0.03] select-none uppercase tracking-tighter">Horizon</div>
</div>
</body></html>
