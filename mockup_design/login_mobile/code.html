<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Horizon | Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#f8f9fa",
                    "on-error": "#ffffff",
                    "surface-variant": "#e1e3e4",
                    "surface-container": "#edeeef",
                    "inverse-primary": "#94ccff",
                    "on-primary-fixed": "#001d32",
                    "secondary-container": "#fc8a40",
                    "tertiary-container": "#007c95",
                    "surface-tint": "#006399",
                    "secondary-fixed-dim": "#ffb68d",
                    "surface-container-low": "#f3f4f5",
                    "on-surface": "#191c1d",
                    "on-tertiary-fixed-variant": "#004e5f",
                    "on-tertiary": "#ffffff",
                    "tertiary": "#006176",
                    "surface-dim": "#d9dadb",
                    "on-primary-fixed-variant": "#004b74",
                    "on-primary": "#ffffff",
                    "surface-bright": "#f8f9fa",
                    "secondary": "#9b4500",
                    "secondary-fixed": "#ffdbc9",
                    "surface-container-highest": "#e1e3e4",
                    "outline": "#707881",
                    "inverse-on-surface": "#f0f1f2",
                    "surface-container-lowest": "#ffffff",
                    "on-surface-variant": "#404850",
                    "primary": "#005d90",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed": "#b3ebff",
                    "on-tertiary-container": "#ecf9ff",
                    "tertiary-fixed-dim": "#4cd6fb",
                    "on-tertiary-fixed": "#001f27",
                    "on-background": "#191c1d",
                    "error-container": "#ffdad6",
                    "on-primary-container": "#f3f7ff",
                    "on-secondary-fixed": "#331200",
                    "on-secondary-container": "#672c00",
                    "primary-fixed": "#cde5ff",
                    "primary-fixed-dim": "#94ccff",
                    "on-secondary-fixed-variant": "#763300",
                    "error": "#ba1a1a",
                    "primary-container": "#0077b6",
                    "background": "#f8f9fa",
                    "outline-variant": "#bfc7d1",
                    "on-error-container": "#93000a",
                    "inverse-surface": "#2e3132",
                    "surface-container-high": "#e7e8e9"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-glass {
            background: rgba(248, 249, 250, 0.8);
            backdrop-filter: blur(24px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface">
<!-- TopAppBar (Suppressed Leading Icon for Focus) -->
<header class="flex items-center w-full px-6 py-4 fixed top-0 z-50 bg-transparent">
<div class="text-lg font-bold text-slate-900 dark:text-slate-50 font-headline tracking-tight">Horizon</div>
</header>
<main class="min-h-screen flex flex-col">
<!-- Hero Image Section (Editorial Style Overlap) -->
<section class="relative h-[397px] w-full overflow-hidden">
<img alt="Cinematic wide shot of jagged snow-capped peaks at sunrise with soft blue and orange hues reflecting off a misty valley" class="w-full h-full object-cover" data-alt="Cinematic wide shot of jagged snow-capped peaks at sunrise with soft blue and orange hues reflecting off a misty valley" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD5OW2-YKzExqPQusqVRr_ERRibmRdM7NQLbQoHbxyNaFTUUnZIs5AYkpozQZYpyN-KWC305CTPDoQXDsyZq25G2KMwj9q3uFO8piFfVSlIyzUavP3QKOq5C4d2yWaKcD1anO43KtUqvn5W2qb0stynOlx3XHYCjAmN9PPzJSwWsWLynHy1myQs0iWJr65JCtkWwrvuN5a2JSyNmRockFQKCxaUM4-W7PJ7B64iIlND94AwIpB07cxRsfNmamc-CzBNKlf7g6Jfta8"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent"></div>
</section>
<!-- Content Canvas -->
<section class="relative -mt-24 px-6 pb-12 flex-grow">
<!-- Glassmorphic Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_32px_64px_rgba(0,93,144,0.04)] border border-outline-variant/10">
<div class="mb-10">
<h1 class="text-4xl font-extrabold font-headline text-on-surface tracking-tight mb-2">Welcome Back</h1>
<p class="text-on-surface-variant font-body">Sign in to resume your journey.</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<div class="space-y-1.5">
<label class="text-xs font-bold font-label uppercase tracking-widest text-on-surface-variant ml-1">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-high border-none rounded-lg focus:ring-2 focus:ring-primary-fixed text-on-surface placeholder:text-outline/60 font-medium transition-all" placeholder="explorer@horizon.com" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-end ml-1">
<label class="text-xs font-bold font-label uppercase tracking-widest text-on-surface-variant">Password</label>
<a class="text-xs font-bold text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-high border-none rounded-lg focus:ring-2 focus:ring-primary-fixed text-on-surface placeholder:text-outline/60 font-medium transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-full shadow-lg shadow-primary/20 active:scale-95 transition-transform" type="submit">
                        Sign In
                    </button>
</form>
<!-- Divider -->
<div class="flex items-center my-8">
<div class="flex-grow h-px bg-surface-variant"></div>
<span class="px-4 text-xs font-bold text-outline font-label uppercase tracking-widest">or</span>
<div class="flex-grow h-px bg-surface-variant"></div>
</div>
<!-- Social Auth -->
<button class="w-full py-4 bg-surface-container-low border border-outline-variant/10 text-on-surface-variant font-bold rounded-full flex items-center justify-center gap-3 active:scale-95 transition-transform">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
<!-- Toggle Switch -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant font-body">New to Horizon? <a class="text-secondary font-bold hover:underline" href="#">Create Account</a></p>
</div>
</div>
<!-- Footnote (Editorial Accent) -->
<div class="mt-12 text-center">
<span class="inline-block w-8 h-[2px] bg-primary-fixed mb-4"></span>
<p class="text-[11px] font-label font-semibold text-outline uppercase tracking-[0.2em]">Curating your next adventure</p>
</div>
</section>
</main>
<!-- Success Message Overlay (Glassmorphism Sample) -->
<div class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6">
<div class="bg-glass rounded-xl p-8 text-center shadow-2xl border border-white/20 max-w-sm">
<div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h3 class="text-xl font-headline font-bold text-on-surface mb-2">Authenticating</h3>
<p class="text-on-surface-variant text-sm">Preparing your personalized travel itinerary...</p>
</div>
</div>
</body></html>
