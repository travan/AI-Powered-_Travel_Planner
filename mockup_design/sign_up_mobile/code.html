<label class="block text-[11px] font-bold uppercase tracking-widest text-primary mb-1.5 ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3.5 focus:ring-2 focus:ring-primary-fixed text-on-surface placeholder:text-outline/50 transition-all" id="email" placeholder="elias.thorne@horizon.com" type="email"/>
</div>
</div>

<div class="relative">
